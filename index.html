<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff8a00">
<title>مرّر الابتسامة</title>
<style>
:root{--orange:#ff8500;--yellow:#ffd43b;--teal:#18b9b0;--ink:#23313b;--muted:#6d7880;--paper:#ffffff;--soft:#fff8e7;--line:#ececec}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;font-family:Tahoma,Arial,sans-serif;color:var(--ink);background:linear-gradient(140deg,#fff3d5 0%,#f9fff7 50%,#e6fffb 100%);padding:12px}.app{width:min(760px,100%);margin:auto;background:var(--paper);border-radius:30px;overflow:hidden;box-shadow:0 18px 55px rgba(38,52,62,.16)}header{padding:25px 18px 22px;text-align:center;background:linear-gradient(135deg,var(--orange),var(--yellow));position:relative}header h1{margin:0;font-size:clamp(31px,7vw,54px);line-height:1.15}header p{margin:9px 0 0;font-size:clamp(15px,3.5vw,20px)}main{padding:18px}.screen{display:none}.screen.active{display:block}.heroEmoji{display:flex;align-items:center;justify-content:center;min-height:155px;border:2px dashed #ffc249;border-radius:25px;background:linear-gradient(145deg,#fffaf0,#effffc);margin-bottom:14px;flex-direction:column}.heroEmoji .emojiBig{font-size:86px;line-height:1}.heroEmoji span{color:var(--muted);margin-top:8px}.search{position:relative;margin-bottom:12px}.search input{padding-right:44px}.searchIcon{position:absolute;right:15px;top:50%;transform:translateY(-50%);font-size:20px}.tabs{display:flex;gap:8px;overflow:auto;padding:2px 0 10px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{border:0;border-radius:999px;background:#fff0d3;font-size:21px;padding:10px 14px;cursor:pointer;flex:0 0 auto}.tab.active{background:var(--teal);box-shadow:0 5px 14px rgba(24,185,176,.28)}.emojiGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;max-height:315px;overflow:auto;background:#fafafa;border:1px solid var(--line);padding:10px;border-radius:20px}.emojiBtn{border:0;background:#fff;border-radius:14px;font-size:31px;aspect-ratio:1;display:grid;place-items:center;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.06);transition:.15s}.emojiBtn:active{transform:scale(.9)}.emojiBtn.chosen{outline:3px solid var(--orange);background:#fff4dd}.empty{text-align:center;color:var(--muted);padding:30px;grid-column:1/-1}label{display:block;font-weight:700;margin:15px 0 7px}input,textarea{width:100%;font:inherit;font-size:16px;padding:14px;border:2px solid var(--line);border-radius:15px;outline:none;background:#fff}input:focus,textarea:focus{border-color:var(--teal)}textarea{min-height:115px;resize:vertical}.counter{text-align:left;font-size:12px;color:var(--muted);margin-top:5px}.actions{display:grid;gap:10px;margin-top:15px}.btn{border:0;border-radius:16px;padding:15px 16px;font:inherit;font-size:18px;font-weight:700;cursor:pointer}.btn.primary{background:var(--teal);color:#fff}.btn.whatsapp{background:#25d366;color:#fff}.btn.secondary{background:#fff0d5;color:#794400}.preview{text-align:center}.previewCard{border-radius:24px;background:linear-gradient(145deg,#fff8e7,#effffc);padding:25px 18px;border:1px solid #e9f2ef;margin:10px 0 17px}.previewEmoji{font-size:90px}.to{font-weight:700;font-size:22px;margin:5px 0 15px}.quote{background:#fff;padding:18px;border-radius:16px;border-right:6px solid var(--teal);text-align:right;white-space:pre-wrap;line-height:1.8}.tiny{font-size:12px;color:var(--muted);margin-top:9px}.success{text-align:center;padding:25px 5px}.success .party{font-size:88px}.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:#25343e;color:#fff;padding:11px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;z-index:30}.toast.show{opacity:1;transform:translate(-50%,0)}.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:20}.piece{position:absolute;top:-35px;font-size:22px;animation:fall 2.4s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.05}}@media(max-width:520px){body{padding:0}.app{min-height:100vh;border-radius:0}.emojiGrid{grid-template-columns:repeat(6,1fr);max-height:285px}.emojiBtn{font-size:28px}main{padding:14px}.heroEmoji{min-height:135px}.heroEmoji .emojiBig{font-size:76px}}
</style>
</head>
<body>
<div class="app">
<header><h1>😊 مرّر الابتسامة</h1><p>اختاري إيموجي واكتبي كلمة جميلة لزميلك</p></header>
<main>
<section id="compose" class="screen active">
<div class="heroEmoji"><div id="selectedEmoji" class="emojiBig">😊</div><span>الإيموجي المختار</span></div>
<div class="search"><span class="searchIcon">🔍</span><input id="emojiSearch" type="search" placeholder="ابحثي باسم القسم: قلوب، فرح، قهوة..." autocomplete="off"></div>
<div id="tabs" class="tabs"></div>
<div id="emojiGrid" class="emojiGrid"></div>
<label for="name">اسم الزميل</label><input id="name" placeholder="مثال: سارة" autocomplete="off">
<label for="message">الرسالة</label><textarea id="message" maxlength="280" placeholder="وجودك معنا يصنع فرقًا جميلًا 🌟"></textarea><div class="counter"><span id="count">0</span>/280</div>
<div class="actions"><button id="previewBtn" class="btn primary" type="button">👀 معاينة الرسالة</button></div>
</section>
<section id="preview" class="screen preview">
<div class="previewCard"><div id="previewEmoji" class="previewEmoji">😊</div><div id="previewName" class="to"></div><div id="previewMessage" class="quote"></div></div>
<div class="actions"><button id="whatsappBtn" class="btn whatsapp" type="button">📲 إرسال عبر واتساب</button><button id="shareBtn" class="btn primary" type="button">🔗 مشاركة من الجوال</button><button id="editBtn" class="btn secondary" type="button">✏️ تعديل</button></div>
<div class="tiny">يعمل زر واتساب على الآيفون والأندرويد والكمبيوتر.</div>
</section>
<section id="success" class="screen success"><div class="party">🎉</div><h2>جهزنا رسالتك!</h2><p>شكرًا لأنك نشرتِ طاقة جميلة بين الزملاء.</p><button id="againBtn" class="btn primary" type="button">إرسال رسالة أخرى</button></section>
</main>
</div><div id="toast" class="toast"></div><div id="confetti" class="confetti"></div>
<script>
(()=>{
const categories={
'😀':{name:'فرح',items:['😀','😃','😄','😁','😆','😅','😂','🤣','😊','😇','🙂','🙃','😉','😍','🥰','😘','😎','🤩','🥳','🤗','🤔','😌','😋','😜','🤭','🫶','🥹','😴','🤓','🫡','😺','😸','😻','🙈','🙉','🙊']},
'❤️':{name:'قلوب',items:['❤️','🩷','🧡','💛','💚','🩵','💙','💜','🤍','🖤','🤎','💖','💗','💓','💞','💕','💘','💝','💟','❣️','❤️‍🔥','❤️‍🩹','💌','💐','🌸','🌷','🌺','🌻','🌼','🪻','🌹','🪷']},
'👏':{name:'تشجيع',items:['👏','🙌','🤝','👍','👌','✌️','🤞','🤟','🤙','💪','🙏','🫶','👋','☝️','👉','👈','👆','👇','✍️','💅','🫰','👐','🤲','🙋‍♀️','🙋‍♂️']},
'🎉':{name:'احتفال',items:['🎉','🎊','🎈','🎁','🏆','🥇','🏅','🎯','🚀','🌟','⭐','✨','💫','🔥','💡','🎵','🎶','🎨','🎭','🎮','🧩','🎲','📸','📣','🔔','💎','🪄','👑']},
'☕':{name:'قهوة وحلا',items:['☕','🍵','🧋','🥤','🍫','🍪','🍩','🧁','🍰','🍿','🍕','🍔','🍟','🌮','🍓','🍉','🍒','🍇','🍊','🍋','🥭','🍎','🍯','🥐','🥨','🍦','🍭','🍬']},
'🐼':{name:'حيوانات',items:['🐼','🐱','🐶','🦁','🐯','🐨','🐰','🦊','🐻','🐸','🐵','🦄','🐝','🦋','🐞','🐢','🐬','🐳','🦜','🐦','🦩','🦚','🐙','🦖']},
'🌈':{name:'طبيعة',items:['🌈','☀️','🌤️','⛅','🌙','⭐','🌊','🍀','🌿','🌱','🌵','🌴','🌳','🍁','🍂','❄️','☁️','🌧️','⚡','🔥','🌍','🪐','🌸','🌻']}
};
let chosen='😊',active='😀';const $=id=>document.getElementById(id);
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$(id).classList.add('active');window.scrollTo({top:0,behavior:'smooth'})}
function renderTabs(){const box=$('tabs');box.innerHTML='';Object.entries(categories).forEach(([icon,data])=>{const b=document.createElement('button');b.type='button';b.className='tab'+(icon===active?' active':'');b.textContent=icon;b.title=data.name;b.onclick=()=>{active=icon;$('emojiSearch').value='';renderTabs();renderGrid()};box.appendChild(b)})}
function renderGrid(){const q=$('emojiSearch').value.trim().toLowerCase();const grid=$('emojiGrid');grid.innerHTML='';let items=[];if(q){Object.values(categories).forEach(cat=>{if(cat.name.includes(q))items.push(...cat.items)});if(!items.length)items=Object.values(categories).flatMap(x=>x.items)}else items=categories[active].items;[...new Set(items)].forEach(e=>{const b=document.createElement('button');b.type='button';b.className='emojiBtn'+(e===chosen?' chosen':'');b.textContent=e;b.onclick=()=>{chosen=e;$('selectedEmoji').textContent=e;renderGrid()};grid.appendChild(b)});if(!grid.children.length)grid.innerHTML='<div class="empty">لا توجد نتائج</div>'}
function messageText(){return `${chosen}\nإلى ${$('name').value.trim()}\n${$('message').value.trim()}\n\nمرّر الابتسامة 😊`}
function toast(text){$('toast').textContent=text;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}
function confetti(){const c=$('confetti');c.innerHTML='';for(let i=0;i<45;i++){const p=document.createElement('div');p.className='piece';p.textContent=['🎉','✨','🟠','🟡','🩵','💛'][Math.floor(Math.random()*6)];p.style.left=Math.random()*100+'vw';p.style.animationDelay=Math.random()*.6+'s';c.appendChild(p)}setTimeout(()=>c.innerHTML='',3000)}
$('emojiSearch').addEventListener('input',renderGrid);$('message').addEventListener('input',e=>$('count').textContent=e.target.value.length);
$('previewBtn').onclick=()=>{const n=$('name').value.trim(),m=$('message').value.trim();if(!n)return toast('اكتبي اسم الزميل أولًا');if(!m)return toast('اكتبي الرسالة أولًا');$('previewEmoji').textContent=chosen;$('previewName').textContent='إلى '+n;$('previewMessage').textContent=m;show('preview')};
$('editBtn').onclick=()=>show('compose');
$('whatsappBtn').onclick=()=>{confetti();window.open('https://wa.me/?text='+encodeURIComponent(messageText()),'_blank','noopener')};
$('shareBtn').onclick=async()=>{if(navigator.share){try{await navigator.share({title:'مرّر الابتسامة',text:messageText()});confetti();show('success');return}catch(e){if(e.name==='AbortError')return}}try{await navigator.clipboard.writeText(messageText());toast('تم نسخ الرسالة');}catch(e){window.open('https://wa.me/?text='+encodeURIComponent(messageText()),'_blank','noopener')}};
$('againBtn').onclick=()=>{$('name').value='';$('message').value='';$('count').textContent='0';chosen='😊';active='😀';$('selectedEmoji').textContent=chosen;$('emojiSearch').value='';renderTabs();renderGrid();show('compose')};
renderTabs();renderGrid();
})();
</script>
</body>
</html>
