<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff7a00">
<title>مرّر الابتسامة</title>
<style>
:root{--orange:#ff7a00;--yellow:#ffd23f;--teal:#18b9b0;--ink:#26343e;--soft:#fff8e9}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:linear-gradient(145deg,#fff3d9,#e8fffc);color:var(--ink);min-height:100vh;padding:14px}.card{width:min(680px,100%);margin:auto;background:#fff;border-radius:26px;box-shadow:0 16px 50px rgba(0,0,0,.12);overflow:hidden}.top{background:linear-gradient(135deg,var(--orange),var(--yellow));padding:24px 18px;text-align:center}.top h1{margin:0;font-size:clamp(28px,7vw,46px)}.top p{margin:8px 0 0}.content{padding:18px}.section{display:none}.section.active{display:block}.selected{background:linear-gradient(145deg,#fff9e9,#ecfffd);border:2px dashed #ffd06b;border-radius:22px;padding:14px;text-align:center;margin-bottom:14px}.big{font-size:82px;line-height:1.1;min-height:92px}.selected .hint{font-size:14px;color:#6c777e}.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{flex:0 0 auto;border:0;background:#fff1d5;border-radius:999px;padding:9px 13px;font-size:20px;cursor:pointer}.tab.active{background:var(--teal);box-shadow:0 4px 12px rgba(24,185,176,.3)}.emoji-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;max-height:310px;overflow:auto;padding:8px;background:#fafafa;border-radius:18px;border:1px solid #eee}.emoji{border:0;background:#fff;border-radius:12px;font-size:31px;aspect-ratio:1;cursor:pointer;display:grid;place-items:center;box-shadow:0 2px 7px rgba(0,0,0,.06)}.emoji:active{transform:scale(.9)}.emoji.chosen{outline:3px solid var(--orange);background:#fff4dc}label{display:block;font-weight:700;margin:14px 0 7px}input,textarea{width:100%;border:2px solid #eee;border-radius:14px;padding:13px;font:inherit;font-size:16px;outline:none}input:focus,textarea:focus{border-color:var(--teal)}textarea{min-height:105px;resize:vertical}.btn{width:100%;border:0;border-radius:15px;padding:14px;font-size:18px;font-weight:700;cursor:pointer;margin-top:13px;background:var(--teal);color:#fff}.btn.secondary{background:#fff1d1;color:#834500}.message{background:#f2fbfa;border-right:6px solid var(--teal);padding:17px;border-radius:14px;text-align:right;margin:18px 0;white-space:pre-wrap}.preview,.success{text-align:center}.small{font-size:12px;color:#748087;text-align:center;margin-top:9px}.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden}.piece{position:absolute;top:-25px;font-size:22px;animation:fall 2.3s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.1}}@media(max-width:430px){.emoji-grid{grid-template-columns:repeat(6,1fr);max-height:285px}.emoji{font-size:28px}.content{padding:14px}}
</style>
</head>
<body>
<div class="card">
<div class="top"><h1>😊 مرّر الابتسامة</h1><p>اختاري الإيموجي واكتبي كلمة جميلة لزميلك</p></div>
<div class="content">
<section id="step1" class="section active">
<div class="selected"><div class="big" id="selectedEmoji">😊</div><div class="hint">الإيموجي المختار</div></div>
<div class="tabs" id="tabs"></div>
<div class="emoji-grid" id="emojiGrid"></div>
<label for="name">اسم الزميل</label><input id="name" placeholder="مثال: سارة" autocomplete="off">
<label for="msg">رسالتك</label><textarea id="msg" placeholder="وجودك معنا يصنع فرقًا جميلًا 🌟"></textarea>
<button class="btn" id="previewBtn" type="button">معاينة الرسالة</button>
</section>
<section id="step2" class="section preview">
<div class="big" id="bigEmoji">😊</div><h2 id="toName"></h2><div class="message" id="messagePreview"></div>
<button class="btn" id="shareBtn" type="button">مشاركة عبر واتساب</button>
<button class="btn secondary" id="nativeShareBtn" type="button">مشاركة من الجوال</button>
<button class="btn secondary" id="backBtn" type="button">تعديل</button>
<div class="small">زر واتساب يعمل على الآيفون والأندرويد.</div>
</section>
<section id="step3" class="section success"><div class="big">🎉</div><h2>تم تجهيز الرسالة</h2><p>انشري طاقة جميلة بين الزملاء.</p><button class="btn" id="againBtn" type="button">إرسال رسالة أخرى</button></section>
</div></div><div class="confetti" id="confetti"></div>
<script>
(()=>{
const groups={
'😀':['😀','😃','😄','😁','😆','😅','😂','🤣','😊','😇','🙂','🙃','😉','😍','🥰','😘','😎','🤩','🥳','🤗','🤔','😌','😋','😜','🤭','🫶','🥹','😴','🤓','🫡','😺','😸','😻','🙈','🙉','🙊'],
'❤️':['❤️','🩷','🧡','💛','💚','🩵','💙','💜','🤍','🖤','🤎','💖','💗','💓','💞','💕','💘','💝','💟','❣️','❤️‍🔥','❤️‍🩹','💌','💐','🌸','🌷','🌺','🌻','🌼','🪻','🌹','🪷'],
'👏':['👏','🙌','🤝','👍','👌','✌️','🤞','🤟','🤙','💪','🙏','🫶','👋','☝️','👉','👈','👆','👇','✍️','💅','🫰','👐','🤲','🙋‍♀️','🙋‍♂️'],
'🎉':['🎉','🎊','🎈','🎁','🏆','🥇','🏅','🎯','🚀','🌟','⭐','✨','💫','🔥','💡','🎵','🎶','🎨','🎭','🎮','🧩','🎲','📸','📣','🔔','💎','🪄','👑'],
'☕':['☕','🍵','🧋','🥤','🍫','🍪','🍩','🧁','🍰','🍿','🍕','🍔','🍟','🌮','🍓','🍉','🍒','🍇','🍊','🍋','🥭','🍎','🍯','🥐','🥨','🍦','🍭','🍬'],
'🐼':['🐼','🐱','🐶','🦁','🐯','🐨','🐰','🦊','🐻','🐸','🐵','🦄','🐝','🦋','🐞','🐢','🐬','🐳','🦜','🐦','🦩','🦚','🐙','🦖'],
'🌈':['🌈','☀️','🌤️','⛅','🌙','⭐','🌊','🍀','🌿','🌱','🌵','🌴','🌳','🍁','🍂','❄️','☁️','🌧️','⚡','🔥','🌍','🪐','🌸','🌻']};
let chosen='😊',active='😀';const $=id=>document.getElementById(id);
function renderTabs(){const t=$('tabs');t.innerHTML='';Object.keys(groups).forEach(k=>{const b=document.createElement('button');b.type='button';b.className='tab'+(k===active?' active':'');b.textContent=k;b.onclick=()=>{active=k;renderTabs();renderGrid()};t.appendChild(b)})}
function renderGrid(){const g=$('emojiGrid');g.innerHTML='';groups[active].forEach(e=>{const b=document.createElement('button');b.type='button';b.className='emoji'+(e===chosen?' chosen':'');b.textContent=e;b.setAttribute('aria-label','اختيار '+e);b.onclick=()=>{chosen=e;$('selectedEmoji').textContent=e;renderGrid()};g.appendChild(b)})}
function show(id){document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));$(id).classList.add('active');scrollTo({top:0,behavior:'smooth'})}
function text(){return `${chosen}\nإلى ${$('name').value.trim()}\n${$('msg').value.trim()}\n\nمرّر الابتسامة 😊`}
function confetti(){const c=$('confetti');c.innerHTML='';for(let i=0;i<40;i++){const p=document.createElement('div');p.className='piece';p.textContent=['🎉','✨','🟠','🟡','🩵'][Math.floor(Math.random()*5)];p.style.left=Math.random()*100+'vw';p.style.animationDelay=Math.random()*.7+'s';c.appendChild(p)}setTimeout(()=>c.innerHTML='',3000)}
$('previewBtn').onclick=()=>{const n=$('name').value.trim(),m=$('msg').value.trim();if(!n)return alert('اكتبي اسم الزميل');if(!m)return alert('اكتبي الرسالة');$('bigEmoji').textContent=chosen;$('toName').textContent='إلى '+n;$('messagePreview').textContent=m;show('step2')};
$('shareBtn').onclick=()=>{const u='https://wa.me/?text='+encodeURIComponent(text());window.location.href=u;confetti()};
$('nativeShareBtn').onclick=async()=>{if(navigator.share){try{await navigator.share({title:'مرّر الابتسامة',text:text()});confetti();return}catch(e){}}window.location.href='https://wa.me/?text='+encodeURIComponent(text())};
$('backBtn').onclick=()=>show('step1');$('againBtn').onclick=()=>{$('name').value='';$('msg').value='';chosen='😊';$('selectedEmoji').textContent=chosen;active='😀';renderTabs();renderGrid();show('step1')};
renderTabs();renderGrid();
})();
</script>
</body></html>
